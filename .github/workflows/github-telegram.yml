name: telegram message

# Controls when the workflow will run
on:
  push:
    branches:
      - '**'
  pull_request:
    types:
      - opened
      - synchronize
      - closed
      - reopened
  create:
  delete:
  issues:
    types:
      - opened
      - closed
      - reopened
  workflow_call:
    inputs:
      caller-id:
        description: 'Unique identifier for the caller to prevent concurrency conflicts'
        required: false
        type: string
        default: 'default'
      additional-text:
        description: 'Additional text passed from the caller workflow'
        required: false
        type: string
      parse-mode:
        description: 'Telegram message parse mode (HTML, Markdown, or MarkdownV2)'
        required: false
        type: string
        default: 'HTML'
      include-header:
        description: 'Whether to include header in the message'
        required: false
        type: boolean
        default: true
    secrets:
      TELEGRAM_TO:
        description: 'Telegram ID passed from the caller workflow'
        required: true
      TELEGRAM_TOKEN:
        description: 'Telegram token passed from the caller workflow'
        required: true
      TELEGRAM_THREAD_ID:
        description: 'Telegram thread ID passed from the caller workflow'
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.caller-id || 'default' }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a job called "build" adn "log-github-event-goodies"
  push:

    if: ${{ github.event.commits != null && inputs.additional-text == null }}

    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      - name: Get commits
        id: get_commits
        uses: actions/checkout@v6
        with:
          # checkout full tree
          fetch-depth: 0

      - name: Prepare commit messages
        id: prepare
        run: |
          source ./.github/scripts/sh/utils.sh
          source ./.github/scripts/sh/prepare_commits.sh
          collect_commits \
            "${{ github.event.repository.name }}" \
            "${{ github.ref_name }}" \
            "${{ github.event.before }}" \
            "${{ github.sha }}" \
            "${{ github.actor }}" \
            "${{ github.repository }}"
          total_parts=$(prepare_commits_message \
            "${{ github.event.repository.name }}" \
            "${{ github.ref_name }}" \
            "${{ github.actor }}" \
            "${{ github.repository }}" \
            "${COMPARE_HASH}" \
            "${{ inputs.include-header }}" \
            "${COMMIT_ARRAY[@]}")
          echo "total_parts=${total_parts}" >> $GITHUB_OUTPUT

      - name: Send messages to Telegram
        if: ${{ steps.prepare.outputs.total_parts != '0' }}
        run: |
          source ./.github/scripts/sh/utils.sh
          source ./.github/scripts/sh/send_telegram.sh
          send_telegram_messages \
            "${{ secrets.TELEGRAM_TOKEN }}" \
            "${{ secrets.TELEGRAM_TO }}" \
            "${{ steps.prepare.outputs.total_parts }}" \
            "${{ inputs.parse-mode || 'HTML' }}"

  create:
    if: ${{ github.event.master_branch != null && github.event.commits == null }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Send message to Telegram
        env:
          # Имя ветки — пользовательский ввод: git разрешает в нём обратные кавычки,
          # поэтому подставляем через env, а не в текст скрипта (см. job pull_request).
          NEW_REF: ${{ github.event.ref }}
          MASTER_BRANCH: ${{ github.event.master_branch }}
          REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO_CREATE: ${{ secrets.TELEGRAM_TO_CREATE }}
          PARSE_MODE: ${{ inputs.parse-mode || 'Markdown' }}
        run: |
          source ./.github/scripts/sh/utils.sh
          source ./.github/scripts/sh/send_telegram.sh
          send_telegram_message \
          "$TELEGRAM_TOKEN" \
          "$TELEGRAM_TO_CREATE" \
          "*[${REPO_NAME}:${REF_NAME}]* by [${ACTOR}](https://github.com/${ACTOR}):

          added branch [${NEW_REF}](https://github.com/${REPO}/tree/${NEW_REF}) from [${MASTER_BRANCH}](https://github.com/${REPO}/tree/${MASTER_BRANCH})" \
          "$PARSE_MODE"

  pull_request:
    if: ${{ github.event.pull_request != null }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Send message to Telegram
        env:
          # Всё, что приходит от пользователя, передаём через env, а НЕ через ${{ }}
          # внутри run. При прямой подстановке GitHub вставляет текст в исходник
          # скрипта, и обратные кавычки из описания PR выполняются шеллом как
          # подстановка команд — шаг падает, а описание исполняется на раннере.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
          ACTOR: ${{ github.actor }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO_PULL_REQUEST: ${{ secrets.TELEGRAM_TO_PULL_REQUEST }}
        run: |
          source ./.github/scripts/sh/utils.sh
          source ./.github/scripts/sh/send_telegram.sh

          action="$PR_ACTION"
          if [ "$PR_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then
            action="merged"
          fi

          # Тело PR подставляется раскрытием переменной — результат повторно не
          # разбирается шеллом, поэтому обратные кавычки внутри безопасны.
          # Дальше это уходит в rich_message.markdown как GitHub Flavored Markdown.
          markdown="## ${REPO_NAME}: pull request #${PR_NUMBER} ${action}

          [**${PR_TITLE}**](https://github.com/${REPO}/pull/${PR_NUMBER})

          by [@${ACTOR}](https://github.com/${ACTOR}) · [\`${HEAD_REF}\`](https://github.com/${REPO}/tree/${HEAD_REF}) → [\`${BASE_REF}\`](https://github.com/${REPO}/tree/${BASE_REF})

          ---

          ${PR_BODY}"

          send_rich_telegram_message \
            "$TELEGRAM_TOKEN" \
            "$TELEGRAM_TO_PULL_REQUEST" \
            "$markdown"

  delete:
    if: ${{ github.event.master_branch == null && github.event.commits == null && github.event.pull_request == null && inputs.additional-text == null && github.event.issue == null }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Send message to Telegram
        env:
          # Имя ветки может содержать обратные кавычки — только через env.
          DELETED_REF: ${{ github.event.ref }}
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO_DELETE: ${{ secrets.TELEGRAM_TO_DELETE }}
          PARSE_MODE: ${{ inputs.parse-mode || 'Markdown' }}
        run: |
          source ./.github/scripts/sh/utils.sh
          source ./.github/scripts/sh/send_telegram.sh
          send_telegram_message \
          "$TELEGRAM_TOKEN" \
          "$TELEGRAM_TO_DELETE" \
          "*[${REPO_NAME}:${REF_NAME}]* by [${ACTOR}](https://github.com/${ACTOR}):

          branch '\`${DELETED_REF}\`' is deleted" \
          "$PARSE_MODE"

  issues:
    if: ${{ github.event.issue != null }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Send message to Telegram
        env:
          # Заголовок issue — произвольный пользовательский текст, включая
          # обратные кавычки. Подставляем через env, а не в текст скрипта.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
          ACTOR: ${{ github.actor }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO_ISSUES: ${{ secrets.TELEGRAM_TO_ISSUES }}
          PARSE_MODE: ${{ inputs.parse-mode || 'Markdown' }}
        run: |
          source ./.github/scripts/sh/utils.sh
          source ./.github/scripts/sh/send_telegram.sh
          send_telegram_message \
          "$TELEGRAM_TOKEN" \
          "$TELEGRAM_TO_ISSUES" \
          "*[${REPO_NAME}]* by [${ACTOR}](https://github.com/${ACTOR}):

          issue #${ISSUE_NUMBER} [${ISSUE_TITLE}](https://github.com/${REPO}/issues/${ISSUE_NUMBER}) was ${ISSUE_ACTION}" \
          "$PARSE_MODE"

  get_last_commit:
    if: ${{ inputs.additional-text != null }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update repository
        run: git pull

      - name: Prepare commit messages
        id: prepare
        run: |
          source ./.github/scripts/sh/utils.sh
          source ./.github/scripts/sh/prepare_commits.sh
          additional_text=$(echo "${{ inputs.additional-text || '' }}" | base64 -d)
          split_text_to_array "$additional_text"
          total_parts=$(prepare_commits_message \
            "${{ github.event.repository.name }}" \
            "${{ github.ref_name }}" \
            "${{ github.actor }}" \
            "${{ github.repository }}" \
            "" \
            "${{ inputs.include-header }}" \
            "${TEXT_ARRAY[@]}")
          echo "total_parts=${total_parts}" >> $GITHUB_OUTPUT

      - name: Send messages to Telegram
        if: ${{ steps.prepare.outputs.total_parts != '0' }}
        run: |
          source ./.github/scripts/sh/utils.sh
          source ./.github/scripts/sh/send_telegram.sh
          send_telegram_messages \
            "${{ secrets.TELEGRAM_TOKEN }}" \
            "${{ secrets.TELEGRAM_TO }}" \
            "${{ steps.prepare.outputs.total_parts }}" \
            "${{ inputs.parse-mode || 'HTML' }}"

