name: Diagnose CDN SSH

on:
  push:
    branches: [codex/reg-ssh-diagnostics-20261106]
    paths: [.github/workflows/cdn-ssh-diagnostics.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CDN_SSH_HOST: ${{ secrets.CDN_SSH_HOST }}
      CDN_SSH_USER: ${{ secrets.CDN_SSH_USER }}
      CDN_SSH_PRIVATE_KEY: ${{ secrets.CDN_SSH_PRIVATE_KEY }}
      CDN_REMOTE_PATH: ${{ secrets.CDN_REMOTE_PATH }}
    steps:
      - name: Prepare existing identity and pinned host key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CDN_SSH_PRIVATE_KEY" > ~/.ssh/cdn_cars
          chmod 600 ~/.ssh/cdn_cars
          printf '%s %s\n' "$CDN_SSH_HOST" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB+xBDp36sVN8C6Ta3YC7IUIwoSMhOmzIw1YimQSbnkW' > ~/.ssh/known_hosts
          ssh -V
      - name: Read-only sequential and concurrent SSH probes
        run: |
          probe() {
            local name="$1"; shift
            local started=$SECONDS rc=0
            timeout 25 ssh -vv -F /dev/null -i ~/.ssh/cdn_cars \
              -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=yes "$@" \
              "$CDN_SSH_USER@$CDN_SSH_HOST" 'sleep 2; true' \
              > "$RUNNER_TEMP/$name.log" 2>&1 || rc=$?
            echo "PROBE $name: exit=$rc seconds=$((SECONDS-started))"
            grep -E 'Connecting to|Connection established|Remote protocol|kex: algorithm|expecting SSH2_MSG|Server accepts key|Authenticated to|Sending command|Exit status|closed by|timed out|Connection reset|Permission denied' "$RUNNER_TEMP/$name.log" || true
          }
          probe default
          probe curve25519 -o KexAlgorithms=curve25519-sha256
          probe qos_none -o IPQoS=none
          probe curve_qos_none -o KexAlgorithms=curve25519-sha256 -o IPQoS=none
          for round in 1 2 3; do
            for i in $(seq 1 6); do probe "burst_${round}_$i" & done
            wait
            probe "after_burst_$round"
          done
          for round in 1 2 3; do
            for i in 1 2; do probe "limited_${round}_$i" & done
            wait
          done
          for round in 1 2 3; do
            scan_rc=0
            timeout 15 ssh-keyscan -T 5 -p 22 -H "$CDN_SSH_HOST" > /dev/null 2>&1 || scan_rc=$?
            echo "KEYSCAN round=$round exit=$scan_rc"
            probe "after_keyscan_$round"
          done
      - name: Read-only rsync listing with existing configuration
        run: |
          rc=0
          timeout 25 rsync --list-only \
            -e "ssh -F /dev/null -i $HOME/.ssh/cdn_cars -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes" \
            "$CDN_SSH_USER@$CDN_SSH_HOST:${CDN_REMOTE_PATH%/}/belgee-penza.ru/" \
            > "$RUNNER_TEMP/rsync.log" 2>&1 || rc=$?
          echo "RSYNC_LIST exit=$rc"
          head -n 12 "$RUNNER_TEMP/rsync.log"
