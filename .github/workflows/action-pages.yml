# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Astro site to GitHub Pages
name: Deploy website to Pages

on:
  schedule:
    - cron: '17 2 * * *'  # 02:17 UTC (05:17 МСК); :17 вместо :00 снижает очередь cron на GitHub
  # Runs on pushes targeting the default branch
  push:
    branches: ["main","brand","dealer"]
    paths-ignore:
      - '.github/scripts/sh/getAirStorage.sh'
      - '.github/scripts/sh/getDealerCarsPrice.sh'
      - '.github/scripts/sh/getDealerPrices.sh'
      - '.github/scripts/sh/getDealerServicePrices.sh'
      - '.github/scripts/sh/getDealerStorage.sh'
      - '.github/scripts/sh/process_xml.sh'
      - '.github/scripts/sh/getSortStorage.sh'
      - '.github/scripts/CarFeedProcessorCSV.py'
      - '.github/scripts/config_air_storage-friend.json'
      - '.github/scripts/config_air_storage.json'
      - '.github/scripts/config.py'
      - '.github/scripts/getOneXML.py'
      - '.github/scripts/GSheetFetcher.js'
      - '.github/scripts/mergeCarPrices.js'
      - '.github/scripts/image_mirror.py'
      - '.github/scripts/sh/uploadImageMirror.sh'
      - '.github/scripts/update_cars_air_storage.py'
      - '.github/scripts/update_cars.py'
      - '.github/scripts/utils.py'
      - '.github/workflows/update_cars.yml'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: 'Точный SHA коммита для деплоя (служебный параметр)'
        required: false
        type: string
      send_specials:
        description: 'TELEGRAM_TO_SPECIAL - отправить уведомление о датах окончания акций'
        required: false
        type: boolean
        default: false
      send_specials_marketing:
        description: 'TELEGRAM_TO_SPECIAL_MARKETING - отправить уведомление о датах окончания акций — маркетинг'
        required: false
        type: boolean
        default: false
      send_rassrochka:
        description: 'TELEGRAM_TO_SPECIAL - отправить уведомление о Рассрочке с путями к файлам'
        required: false
        type: boolean
        default: false
      send_rassrochka_marketing:
        description: 'TELEGRAM_TO_SPECIAL_MARKETING - отправить уведомление о Рассрочке — маркетинг'
        required: false
        type: boolean
        default: false
      send_english_words:
        description: 'TELEGRAM_TO_SPECIAL - отправить отчёт по английским словам'
        required: false
        type: boolean
        default: false
      run_linkinator:
        description: 'linkinator - запустить проверку ссылок'
        required: false
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-pages:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check-pages.outputs.pages_enabled }}
    steps:
      - name: Check GitHub Pages status
        id: check-pages
        run: |
          PAGES_STATUS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -w '%{http_code}' -o /dev/null)
          if [ "$PAGES_STATUS" = "200" ]; then
            echo "pages_enabled=true" >> $GITHUB_OUTPUT
          else
            echo "pages_enabled=false" >> $GITHUB_OUTPUT
          fi

  # Выбор целей деплоя по переменным репозитория:
  #   DEPLOY_TO_PAGES — GitHub Pages включён по умолчанию, отключается значением 'false'
  #   DEPLOY_TO_YC    — Yandex Object Storage включается только значением 'true' и требует YC_BUCKET
  #   DEPLOY_TO_VPS   — прямой VPS-деплой включается только значением 'true' и требует VPS_TARGET
  #                     (либо старую VPS_HOST — лазейка на период миграции)
  determine_targets:
    needs: check-pages
    runs-on: ubuntu-latest
    outputs:
      deploy_pages: ${{ steps.set_targets.outputs.deploy_pages }}
      deploy_yc: ${{ steps.set_targets.outputs.deploy_yc }}
      deploy_vps: ${{ steps.set_targets.outputs.deploy_vps }}
    steps:
      - name: Determine deployment targets
        id: set_targets
        env:
          PAGES_ENABLED: ${{ needs.check-pages.outputs.pages_enabled }}
          DEPLOY_TO_PAGES: ${{ vars.DEPLOY_TO_PAGES }}
          DEPLOY_TO_YC: ${{ vars.DEPLOY_TO_YC }}
          YC_BUCKET: ${{ vars.YC_BUCKET }}
          DEPLOY_TO_VPS: ${{ vars.DEPLOY_TO_VPS }}
          VPS_TARGET: ${{ vars.VPS_TARGET }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          if [ "$PAGES_ENABLED" = "true" ] && [ "$DEPLOY_TO_PAGES" != "false" ]; then
            echo "deploy_pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_pages=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$DEPLOY_TO_YC" = "true" ] && [ -n "$YC_BUCKET" ]; then
            echo "deploy_yc=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_yc=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$DEPLOY_TO_VPS" = "true" ] && { [ -n "$VPS_TARGET" ] || [ -n "$VPS_HOST" ]; }; then
            echo "deploy_vps=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_vps=false" >> "$GITHUB_OUTPUT"
          fi

  determine_env:
    needs: check-pages
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set_env.outputs.env_name }}
    steps:
      - id: set_env
        run: |
          PROD_BRANCHES=("main" "master" "brand" "dealer") # Bash array
          CURRENT_BRANCH="${{ github.ref_name }}"
          IS_PROD=false
          for branch in "${PROD_BRANCHES[@]}"; do
            if [[ "$CURRENT_BRANCH" == "$branch" ]]; then
              IS_PROD=true
              break
            fi
          done
          if $IS_PROD; then
            echo "env_name=production" >> $GITHUB_OUTPUT
          else
            echo "env_name=development" >> $GITHUB_OUTPUT
          fi

  # Build job
  build:
    needs: [check-pages, determine_env, determine_targets]
    if: needs.determine_targets.outputs.deploy_pages == 'true' || needs.determine_targets.outputs.deploy_yc == 'true' || needs.determine_targets.outputs.deploy_vps == 'true'
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest

    # Указываете окружение и его переменные
    environment:
      name: ${{ needs.determine_env.outputs.env_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # update_cars передаёт точный SHA, чтобы workflow_dispatch не взял
          # предыдущий commit сразу после push. Для push/schedule/manual остаётся github.sha.
          ref: ${{ github.event.inputs.deploy_sha || github.sha }}

      - name: Capture deployment SHA
        id: deployment_metadata
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            node_modules
            .pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup Pages
        if: needs.determine_targets.outputs.deploy_pages == 'true'
        id: pages
        uses: actions/configure-pages@v6

      - name: Init output.txt
        run: |
          > output.txt

      - name: Create env file
        run: |
          touch .env
          echo JSON_REPO=${{ secrets.JSON_REPO }} >> .env
          echo DOMAIN=${{ vars.DOMAIN }} >> .env
          cat .env

      - name: PNPM install
        run: |
          npm install -g pnpm
          pnpm install --no-frozen-lockfile

      - name: Download JSONs
        run: |
          pnpm downloadCommonRepo
        env:
          JSON_REPO: ${{ secrets.JSON_REPO }}
          DOMAIN: ${{ vars.DOMAIN }}
          FINE_GRAINED_PAT: ${{ secrets.FINE_GRAINED_PAT }}

      - name: Load env.json into environment
        run: |
          if [ -f src/data/site/env.json ]; then
            node -e '
              const data = JSON.parse(require("fs").readFileSync("src/data/site/env.json","utf8"));
              for (const [k,v] of Object.entries(data)) {
                if (typeof v === "object") console.log(k+"="+JSON.stringify(v));
                else console.log(k+"="+v);
              }
            ' >> $GITHUB_ENV
            echo "✅ env.json loaded into environment"
          else
            echo "⚠ src/data/site/env.json not found — skipping"
          fi

      - name: Get dealer prices
        if: ${{ env.DEALER_PRICE_CSV_URL && env.DEALER_PRICE_CSV_COLUMN }}
        run: |
          pnpm getDealerPrices
        continue-on-error: true
        env:
          CSV_URL: ${{ env.DEALER_PRICE_CSV_URL }}
          QUERY_STRING: ${{ env.DEALER_PRICE_CSV_COLUMN }}
          KEY_MAPPING: ${{ env.DEALER_PRICE_KEY_MAPPING }}

      - name: Get dealer Service prices
        if: ${{ env.DEALER_SERVICE_PRICE_CSV_URL && env.DEALER_SERVICE_PRICE_QUERY_STRING }}
        run: |
          pnpm getDealerServicePrices
        continue-on-error: true
        env:
          CSV_URL: ${{ env.DEALER_SERVICE_PRICE_CSV_URL }}
          QUERY_STRING: ${{ env.DEALER_SERVICE_PRICE_QUERY_STRING }}
          KEY_MAPPING: ${{ env.DEALER_SERVICE_PRICE_KEY_MAPPING }}

      - name: ls files
        run: |
          if [[ -d src/data ]]; then ls -al src/data; fi

      - name: Merge car prices
        run: |
          pnpm mergeCarPrices

      - name: Replace Placeholders in JSON
        run: |
          pnpm replacePlaceholdersAndSearchDates
        env:
          DOMAIN: ${{ vars.DOMAIN }}

      - name: Search Rassrochka word
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.send_rassrochka == 'true' || github.event.inputs.send_rassrochka_marketing == 'true') }}
        run: |
          pnpm searchRassrochkaWord
        env:
          DOMAIN: ${{ vars.DOMAIN }}

      - name: Astro Build
        run: |
          pnpm build --outDir ./_site
          cp ./_site/sitemap-0.xml ./_site/sitemap.xml

      - name: Find English Words
        if: ${{ vars.FIND_ENGLISH_WORDS != 'false' || github.event.inputs.send_english_words == 'true' }}
        run: |
          pip install beautifulsoup4 --quiet
          python3 .github/scripts/findEnglishWords.py
        env:
          DOMAIN: ${{ vars.DOMAIN }}

      - name: Send English Words CSV to Telegram
        if: ${{ github.event.inputs.send_english_words == 'true' }}
        run: |
          source .github/scripts/sh/utils.sh
          source .github/scripts/sh/send_telegram.sh
          CSV_FILE=$(ls tmp/notifications/english-words-*.csv 2>/dev/null | head -1)
          if [ -n "$CSV_FILE" ]; then
            CAPTION="Английские слова на сайте ${{ vars.DOMAIN }}"
            send_telegram_file "${{ secrets.TELEGRAM_TOKEN }}" "${{ secrets.TELEGRAM_TO_SPECIAL }}" "$CSV_FILE" "$CAPTION"
          else
            echo "CSV-файл не найден, пропускаем отправку"
          fi

      - name: Set output
        id: set_output
        run: |
          if [ -s output.txt ]; then
            encoded_output=$(base64 -w 0 output.txt)
            echo "script_output=$encoded_output" >> $GITHUB_OUTPUT
          fi

      - name: Check notifications
        id: check_specials
        run: |
          if [ -s tmp/notifications/dates.txt ]; then
            echo "specials=$(base64 -w 0 tmp/notifications/dates.txt)" >> $GITHUB_OUTPUT
          fi
          if [ -s tmp/notifications/dates-marketing.txt ]; then
            echo "specials_marketing=$(base64 -w 0 tmp/notifications/dates-marketing.txt)" >> $GITHUB_OUTPUT
          fi
          if [ -s tmp/notifications/rassrochka.txt ]; then
            echo "specials_rassrochka=$(base64 -w 0 tmp/notifications/rassrochka.txt)" >> $GITHUB_OUTPUT
          fi
          if [ -s tmp/notifications/rassrochka-marketing.txt ]; then
            echo "specials_rassrochka_marketing=$(base64 -w 0 tmp/notifications/rassrochka-marketing.txt)" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        if: needs.determine_targets.outputs.deploy_pages == 'true'
        uses: actions/upload-pages-artifact@v5

      - name: Upload portable site artifact
        if: needs.determine_targets.outputs.deploy_yc == 'true' || needs.determine_targets.outputs.deploy_vps == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: ./_site
          retention-days: 3

      - name: Create After_deploy text
        id: after_deploy
        run: |
          echo text="<blockquote>After deploy: https://${{ vars.DOMAIN }}</blockquote>" >> $GITHUB_OUTPUT
          echo site_domain="${{ vars.DOMAIN }}" >> $GITHUB_OUTPUT

    outputs:
      script_output: ${{ steps.set_output.outputs.script_output }}
      specials: ${{ steps.check_specials.outputs.specials }}
      specials_marketing: ${{ steps.check_specials.outputs.specials_marketing }}
      specials_rassrochka: ${{ steps.check_specials.outputs.specials_rassrochka }}
      specials_rassrochka_marketing: ${{ steps.check_specials.outputs.specials_rassrochka_marketing }}
      after_deploy: ${{ steps.after_deploy.outputs.text }}
      site_domain: ${{ steps.after_deploy.outputs.site_domain }}
      deploy_sha: ${{ steps.deployment_metadata.outputs.sha }}

  # Deployment job
  deploy:
    needs: [build, determine_targets]
    if: needs.determine_targets.outputs.deploy_pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Деплой той же сборки в Yandex Object Storage.
  # Удаление лишних объектов и dry-run управляются отдельными opt-in переменными.
  deploy_yc:
    needs: [build, determine_targets]
    if: needs.determine_targets.outputs.deploy_yc == 'true'
    runs-on: ubuntu-latest
    environment:
      name: yandex-cloud
      url: https://website.yandexcloud.net/${{ vars.YC_BUCKET }}/
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: _site

      - name: Validate Yandex Cloud deployment
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_PAGER: ''
          YC_BUCKET: ${{ vars.YC_BUCKET }}
          SITE_DOMAIN: ${{ needs.build.outputs.site_domain }}
        run: |
          set -euo pipefail

          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "YC_ACCESS_KEY_ID and YC_SECRET_ACCESS_KEY must be configured"
            exit 1
          fi

          if [[ ! "$YC_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || \
             [[ "$YC_BUCKET" == *..* ]] || [[ "$YC_BUCKET" == *.-* ]] || [[ "$YC_BUCKET" == *-.* ]]; then
            echo "Invalid YC_BUCKET: $YC_BUCKET"
            exit 1
          fi

          if [ -n "$SITE_DOMAIN" ] && [ "$YC_BUCKET" != "$SITE_DOMAIN" ] && [ "$YC_BUCKET" != "www.$SITE_DOMAIN" ]; then
            echo "YC_BUCKET must match DOMAIN or www.DOMAIN: bucket=$YC_BUCKET domain=$SITE_DOMAIN"
            exit 1
          fi

          test -f _site/index.html
          aws s3api head-bucket \
            --bucket "$YC_BUCKET" \
            --endpoint-url https://storage.yandexcloud.net

      - name: Sync to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_PAGER: ''
          YC_BUCKET: ${{ vars.YC_BUCKET }}
          YC_DEPLOY_DRY_RUN: ${{ vars.YC_DEPLOY_DRY_RUN }}
          YC_SYNC_DELETE: ${{ vars.YC_SYNC_DELETE }}
        run: |
          set -euo pipefail
          sync_args=(
            --endpoint-url https://storage.yandexcloud.net
          )

          if [ "$YC_DEPLOY_DRY_RUN" = "true" ]; then
            sync_args+=(--dryrun)
          else
            sync_args+=(--only-show-errors)
          fi

          if [ "$YC_SYNC_DELETE" = "true" ]; then
            sync_args+=(--delete)
          fi

          aws s3 sync ./_site "s3://$YC_BUCKET" "${sync_args[@]}"

  # Атомарный деплой готового артефакта через ограниченный SSH forced-command.
  # Ключ не получает shell, PTY, forwarding или доступ к другим доменам сервера.
  deploy_vps:
    needs: [build, determine_targets]
    if: needs.determine_targets.outputs.deploy_vps == 'true'
    runs-on: ubuntu-latest
    environment:
      name: static-vps
      url: https://${{ vars.VPS_DOMAIN || vars.DOMAIN }}/
    steps:
      - name: Resolve VPS target
        env:
          SITE_DOMAIN: ${{ needs.build.outputs.site_domain }}
          VPS_DOMAIN: ${{ vars.VPS_DOMAIN || vars.DOMAIN }}
          VPS_KEEP_RELEASES: ${{ vars.VPS_KEEP_RELEASES || '3' }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PROXY_SSH_PRIVATE_KEY: ${{ secrets.VPS_PROXY_SSH_PRIVATE_KEY }}
          VPS_TARGET: ${{ vars.VPS_TARGET }}
          VPS_TARGETS: ${{ vars.VPS_TARGETS }}
          LEGACY_VPS_HOST: ${{ vars.VPS_HOST }}
          LEGACY_VPS_PORT: ${{ vars.VPS_PORT }}
          LEGACY_VPS_USER: ${{ vars.VPS_USER }}
          LEGACY_VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          LEGACY_VPS_PROXY_HOST: ${{ vars.VPS_PROXY_HOST }}
          LEGACY_VPS_PROXY_PORT: ${{ vars.VPS_PROXY_PORT }}
          LEGACY_VPS_PROXY_USER: ${{ vars.VPS_PROXY_USER }}
          LEGACY_VPS_PROXY_KNOWN_HOSTS: ${{ vars.VPS_PROXY_KNOWN_HOSTS }}
          LEGACY_VPS_HEALTHCHECK_VIA_PROXY: ${{ vars.VPS_HEALTHCHECK_VIA_PROXY }}
        run: |
          set -euo pipefail

          # --- Резолвер цели ---------------------------------------------------------
          # Профиль берётся из org-таблицы VPS_TARGETS по репозиторной переменной
          # VPS_TARGET. Пока VPS_TARGET не задан, работает старая ветка на vars.VPS_*
          # (лазейка на период миграции, снимается вместе с org-переменными VPS_*).

          if [ -n "$VPS_TARGET" ]; then
            if [ -z "$VPS_TARGETS" ]; then
              echo "::error::VPS_TARGET='$VPS_TARGET', но org-переменная VPS_TARGETS пуста"
              exit 1
            fi

            profile=$(printf '%s' "$VPS_TARGETS" | jq -e --arg t "$VPS_TARGET" '.[$t]') || {
              echo "::error::Профиль '$VPS_TARGET' отсутствует в VPS_TARGETS"
              exit 1
            }

            # Достать строковое поле профиля; отсутствующее поле даёт пустую строку
            field() {
              printf '%s' "$profile" | jq -r --arg k "$1" '.[$k] // "" | if type == "string" then . else tostring end'
            }

            VPS_HOST=$(field host)
            VPS_PORT=$(field port)
            VPS_USER=$(field user)
            VPS_KNOWN_HOSTS=$(field known_hosts)
            VPS_PROXY_HOST=$(field proxy_host)
            VPS_PROXY_PORT=$(field proxy_port)
            VPS_PROXY_USER=$(field proxy_user)
            VPS_PROXY_KNOWN_HOSTS=$(field proxy_known_hosts)
            VPS_HEALTHCHECK_VIA_PROXY=$(field healthcheck_via_proxy)

            # Четыре поля обязательны в любом профиле
            for pair in "host:$VPS_HOST" "port:$VPS_PORT" "user:$VPS_USER" "known_hosts:$VPS_KNOWN_HOSTS"; do
              if [ -z "${pair#*:}" ]; then
                echo "::error::В профиле '$VPS_TARGET' нет обязательного поля ${pair%%:*}"
                exit 1
              fi
            done

            echo "Резолвер: VPS_TARGET=$VPS_TARGET -> host=$VPS_HOST port=$VPS_PORT user=$VPS_USER proxy_host=${VPS_PROXY_HOST:-(нет)}"

          elif [ -n "$LEGACY_VPS_HOST" ]; then
            # Лазейка: репозиторий ещё не переведён на VPS_TARGET
            VPS_HOST="$LEGACY_VPS_HOST"
            VPS_PORT="${LEGACY_VPS_PORT:-22}"
            VPS_USER="${LEGACY_VPS_USER:-site-deploy}"
            VPS_KNOWN_HOSTS="$LEGACY_VPS_KNOWN_HOSTS"
            VPS_PROXY_HOST="$LEGACY_VPS_PROXY_HOST"
            VPS_PROXY_PORT="$LEGACY_VPS_PROXY_PORT"
            VPS_PROXY_USER="$LEGACY_VPS_PROXY_USER"
            VPS_PROXY_KNOWN_HOSTS="$LEGACY_VPS_PROXY_KNOWN_HOSTS"
            VPS_HEALTHCHECK_VIA_PROXY="$LEGACY_VPS_HEALTHCHECK_VIA_PROXY"

            echo "Резолвер: VPS_TARGET не задан, работают старые vars.VPS_* -> host=$VPS_HOST port=$VPS_PORT user=$VPS_USER proxy_host=${VPS_PROXY_HOST:-(нет)}"

          else
            echo "::error::DEPLOY_TO_VPS=true, но не задан ни VPS_TARGET, ни VPS_HOST"
            exit 1
          fi

          # Умолчание порта прыжка — как в прежнем vars.VPS_PROXY_PORT || '22'
          VPS_PROXY_PORT="${VPS_PROXY_PORT:-22}"

          # --- Валидация (в точности прежняя, но по разрешённым значениям) ------------

          if [[ ! "$VPS_DOMAIN" =~ ^[a-z0-9][a-z0-9.-]{1,251}[a-z0-9]$ ]]; then
            echo "Invalid VPS_DOMAIN: $VPS_DOMAIN"
            exit 1
          fi

          if [ "$VPS_DOMAIN" != "$SITE_DOMAIN" ]; then
            echo "VPS_DOMAIN must match DOMAIN: vps=$VPS_DOMAIN domain=$SITE_DOMAIN"
            exit 1
          fi

          if [[ ! "$VPS_KEEP_RELEASES" =~ ^[1-9][0-9]?$ ]]; then
            echo "VPS_KEEP_RELEASES must be an integer from 1 to 99"
            exit 1
          fi

          if [[ ! "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "Invalid VPS_HOST: $VPS_HOST"
            exit 1
          fi

          if [[ ! "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "Invalid VPS_USER: $VPS_USER"
            exit 1
          fi

          if [[ ! "$VPS_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( VPS_PORT > 65535 )); then
            echo "Invalid VPS_PORT: $VPS_PORT"
            exit 1
          fi

          if [ -z "$VPS_SSH_PRIVATE_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "VPS_SSH_PRIVATE_KEY and VPS_KNOWN_HOSTS must be configured"
            exit 1
          fi

          if [ -n "$VPS_PROXY_HOST" ]; then
            if [[ ! "$VPS_PROXY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
              echo "Invalid VPS_PROXY_HOST: $VPS_PROXY_HOST"
              exit 1
            fi

            if [[ ! "$VPS_PROXY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
              echo "Invalid VPS_PROXY_USER: $VPS_PROXY_USER"
              exit 1
            fi

            if [[ ! "$VPS_PROXY_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( VPS_PROXY_PORT > 65535 )); then
              echo "Invalid VPS_PROXY_PORT: $VPS_PROXY_PORT"
              exit 1
            fi

            if [ -z "$VPS_PROXY_SSH_PRIVATE_KEY" ] || [ -z "$VPS_PROXY_KNOWN_HOSTS" ]; then
              echo "VPS_PROXY_SSH_PRIVATE_KEY and VPS_PROXY_KNOWN_HOSTS must be configured when VPS_PROXY_HOST is set"
              exit 1
            fi
          elif [ -n "$VPS_PROXY_USER" ] || [ -n "$VPS_PROXY_SSH_PRIVATE_KEY" ] || [ -n "$VPS_PROXY_KNOWN_HOSTS" ]; then
            echo "VPS_PROXY_HOST is required when any proxy setting is configured"
            exit 1
          fi

          if [ -n "$VPS_HEALTHCHECK_VIA_PROXY" ] && [ "$VPS_HEALTHCHECK_VIA_PROXY" != "true" ] && [ "$VPS_HEALTHCHECK_VIA_PROXY" != "false" ]; then
            echo "VPS_HEALTHCHECK_VIA_PROXY must be true, false, or empty"
            exit 1
          fi

          if [ "$VPS_HEALTHCHECK_VIA_PROXY" = "true" ] && [ -z "$VPS_PROXY_HOST" ]; then
            echo "VPS_PROXY_HOST is required when VPS_HEALTHCHECK_VIA_PROXY=true"
            exit 1
          fi

          # --- Передача значений следующим шагам -------------------------------------
          # Только heredoc-форма: known_hosts бывает многострочным, key=value его сломает.
          # Имена регистрозависимы и совпадают с теми, что читают шаги ниже.

          emit() {
            local delim
            delim="EOF_$(openssl rand -hex 8)"
            {
              printf '%s<<%s\n' "$1" "$delim"
              printf '%s\n' "$2"
              printf '%s\n' "$delim"
            } >> "$GITHUB_ENV"
          }

          emit VPS_HOST                  "$VPS_HOST"
          emit VPS_PORT                  "$VPS_PORT"
          emit VPS_USER                  "$VPS_USER"
          emit VPS_KNOWN_HOSTS           "$VPS_KNOWN_HOSTS"
          emit VPS_PROXY_HOST            "$VPS_PROXY_HOST"
          emit VPS_PROXY_PORT            "$VPS_PROXY_PORT"
          emit VPS_PROXY_USER            "$VPS_PROXY_USER"
          emit VPS_PROXY_KNOWN_HOSTS     "$VPS_PROXY_KNOWN_HOSTS"
          emit VPS_HEALTHCHECK_VIA_PROXY "$VPS_HEALTHCHECK_VIA_PROXY"

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: ${{ runner.temp }}/site-dist-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify artifact contents
        run: |
          set -euo pipefail
          test -f "${{ runner.temp }}/site-dist-${{ github.run_id }}-${{ github.run_attempt }}/index.html"

      - name: Configure restricted SSH key
        # VPS_KNOWN_HOSTS, VPS_PROXY_HOST, VPS_PROXY_KNOWN_HOSTS приходят из
        # шага Resolve VPS target через $GITHUB_ENV
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_PROXY_SSH_PRIVATE_KEY: ${{ secrets.VPS_PROXY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "${{ runner.temp }}/ghstatic-ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "${{ runner.temp }}/ghstatic-ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "${{ runner.temp }}/ghstatic-ssh/known_hosts"
          chmod 600 "${{ runner.temp }}/ghstatic-ssh/id_ed25519" "${{ runner.temp }}/ghstatic-ssh/known_hosts"
          ssh-keygen -y -f "${{ runner.temp }}/ghstatic-ssh/id_ed25519" >/dev/null
          test -s "${{ runner.temp }}/ghstatic-ssh/known_hosts"

          if [ -n "$VPS_PROXY_HOST" ]; then
            printf '%s\n' "$VPS_PROXY_SSH_PRIVATE_KEY" > "${{ runner.temp }}/ghstatic-ssh/proxy_ed25519"
            printf '%s\n' "$VPS_PROXY_KNOWN_HOSTS" > "${{ runner.temp }}/ghstatic-ssh/proxy_known_hosts"
            chmod 600 "${{ runner.temp }}/ghstatic-ssh/proxy_ed25519" "${{ runner.temp }}/ghstatic-ssh/proxy_known_hosts"
            ssh-keygen -y -f "${{ runner.temp }}/ghstatic-ssh/proxy_ed25519" >/dev/null
            test -s "${{ runner.temp }}/ghstatic-ssh/proxy_known_hosts"
          fi

      - name: Upload and activate VPS release
        # VPS_HOST, VPS_PORT, VPS_USER и VPS_PROXY_* приходят из шага
        # Resolve VPS target через $GITHUB_ENV
        env:
          VPS_DOMAIN: ${{ vars.VPS_DOMAIN || vars.DOMAIN }}
          VPS_KEEP_RELEASES: ${{ vars.VPS_KEEP_RELEASES || '3' }}
          DEPLOY_SHA: ${{ needs.build.outputs.deploy_sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/site-dist-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          release_id="${DEPLOY_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          ssh_options=(
            -T
            -p "$VPS_PORT"
            -i "${{ runner.temp }}/ghstatic-ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${{ runner.temp }}/ghstatic-ssh/known_hosts"
            -o ConnectTimeout=15
          )

          if [ -n "$VPS_PROXY_HOST" ]; then
            proxy_command="ssh -W %h:%p -p $VPS_PROXY_PORT -i ${{ runner.temp }}/ghstatic-ssh/proxy_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${{ runner.temp }}/ghstatic-ssh/proxy_known_hosts -o ConnectTimeout=15 $VPS_PROXY_USER@$VPS_PROXY_HOST"
            ssh_options+=( -o "ProxyCommand=$proxy_command" )
          fi

          tar -C "$ARTIFACT_DIR" -czf - . | \
            ssh "${ssh_options[@]}" \
              "$VPS_USER@$VPS_HOST" \
              "$release_id $VPS_KEEP_RELEASES"

      - name: Verify public site
        # VPS_HOST, VPS_PROXY_* и VPS_HEALTHCHECK_VIA_PROXY приходят из шага
        # Resolve VPS target через $GITHUB_ENV
        env:
          VPS_DOMAIN: ${{ vars.VPS_DOMAIN || vars.DOMAIN }}
        run: |
          set -euo pipefail

          curl_options=(
            --fail
            --silent
            --show-error
            --location
            --retry 3
            --retry-all-errors
            --max-time 20
          )

          if [ "$VPS_HEALTHCHECK_VIA_PROXY" = "true" ]; then
            healthcheck_port=18443
            ssh -N \
              -L "127.0.0.1:$healthcheck_port:$VPS_HOST:443" \
              -p "$VPS_PROXY_PORT" \
              -i "${{ runner.temp }}/ghstatic-ssh/proxy_ed25519" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${{ runner.temp }}/ghstatic-ssh/proxy_known_hosts" \
              -o ExitOnForwardFailure=yes \
              -o ConnectTimeout=15 \
              "$VPS_PROXY_USER@$VPS_PROXY_HOST" &
            relay_pid=$!
            trap 'kill "$relay_pid" 2>/dev/null || true; wait "$relay_pid" 2>/dev/null || true' EXIT

            for _ in {1..20}; do
              if nc -z 127.0.0.1 "$healthcheck_port"; then
                break
              fi
              if ! kill -0 "$relay_pid" 2>/dev/null; then
                echo "HTTPS relay exited before the healthcheck started"
                exit 1
              fi
              sleep 1
            done

            nc -z 127.0.0.1 "$healthcheck_port"
            curl_options+=(--connect-to "$VPS_DOMAIN:443:127.0.0.1:$healthcheck_port")
          fi

          curl "${curl_options[@]}" "https://$VPS_DOMAIN/" >/dev/null

      - name: Clean downloaded artifact
        if: always()
        run: |
          rm -rf -- \
            "${{ runner.temp }}/site-dist-${{ github.run_id }}-${{ github.run_attempt }}" \
            "${{ runner.temp }}/ghstatic-ssh"

  notify_telegram_error:
    needs: build
    if: ${{ needs.build.outputs.script_output != '' }}
    uses: ./.github/workflows/github-telegram.yml
    with:
      additional-text: |
        ${{ needs.build.outputs.script_output }}
    secrets:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO_ERROR }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

  notify_telegram_after_deploy:
    needs: [build, deploy, deploy_yc, deploy_vps]
    if: ${{ !cancelled() && (needs.deploy.result == 'success' || needs.deploy_yc.result == 'success' || needs.deploy_vps.result == 'success') }}
    uses: ./.github/workflows/github-telegram.yml
    with:
      caller-id: 'after-deploy'
      additional-text: |
        $(echo -n '${{ needs.build.outputs.after_deploy }}' | base64)
    secrets:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO_AFTER_DEPLOY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

  notify_telegram_about_special:
    needs: [build]
    if: ${{ needs.build.outputs.specials != '' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.send_specials == 'true')) }}
    uses: ./.github/workflows/github-telegram.yml
    with:
      caller-id: 'special-offers'
      additional-text: |
        ${{ needs.build.outputs.specials }}
    secrets:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO_SPECIAL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

  check_marketing_secret:
    needs: [build]
    if: needs.build.outputs.specials_marketing != '' || needs.build.outputs.specials_rassrochka_marketing != ''
    runs-on: ubuntu-latest
    outputs:
      secret_exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if marketing telegram secret exists
        id: check
        run: |
          if [ -n "${{ secrets.TELEGRAM_TO_SPECIAL_MARKETING }}" ]; then
            echo "TELEGRAM_TO_SPECIAL_MARKETING exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "TELEGRAM_TO_SPECIAL_MARKETING does not exist"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  notify_telegram_about_special_marketing:
    needs: [build, check_marketing_secret]
    if: ${{ needs.check_marketing_secret.outputs.secret_exists == 'true' && needs.build.outputs.specials_marketing != '' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.send_specials_marketing == 'true')) }}
    uses: ./.github/workflows/github-telegram.yml
    with:
      caller-id: 'special-marketing'
      include-header: false
      additional-text: |
        ${{ needs.build.outputs.specials_marketing }}
    secrets:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO_SPECIAL_MARKETING }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

  notify_telegram_about_rassrochka:
    needs: [build]
    if: ${{ needs.build.outputs.specials_rassrochka != '' && github.event_name == 'workflow_dispatch' && github.event.inputs.send_rassrochka == 'true' }}
    uses: ./.github/workflows/github-telegram.yml
    with:
      caller-id: 'rassrochka'
      additional-text: |
        ${{ needs.build.outputs.specials_rassrochka }}
    secrets:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO_SPECIAL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

  notify_telegram_about_rassrochka_marketing:
    needs: [build, check_marketing_secret]
    if: ${{ needs.check_marketing_secret.outputs.secret_exists == 'true' && needs.build.outputs.specials_rassrochka_marketing != '' && github.event_name == 'workflow_dispatch' && github.event.inputs.send_rassrochka_marketing == 'true' }}
    uses: ./.github/workflows/github-telegram.yml
    with:
      caller-id: 'rassrochka-marketing'
      include-header: false
      additional-text: |
        ${{ needs.build.outputs.specials_rassrochka_marketing }}
    secrets:
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO_SPECIAL_MARKETING }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

  check_links:
    needs: [build, deploy, deploy_yc, deploy_vps]
    if: ${{ !cancelled() && (needs.deploy.result == 'success' || needs.deploy_yc.result == 'success' || needs.deploy_vps.result == 'success') && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_linkinator == 'true')) }}
    uses: ./.github/workflows/linkinator.yml
    secrets: inherit
